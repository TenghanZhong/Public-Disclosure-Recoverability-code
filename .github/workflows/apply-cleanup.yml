name: apply-cleanup

on:
  push:
    branches:
      - chore/artifact-cleanup

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/artifact-cleanup
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply changes
        shell: bash
        run: |
          cat > /tmp/changes.b64 <<'EOF'

EOF
          base64 -d /tmp/changes.b64 | gzip -d > /tmp/changes.patch
          git apply /tmp/changes.patch
          rm -f .github/workflows/apply-cleanup.yml

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate
        shell: bash
        run: |
          python -m compileall -q mandate_setirl scripts tests
          pytest -q

      - name: Commit
        shell: bash
        run: |
          git config user.name "Artifact Maintenance"
          git config user.email "artifact-maintenance@users.noreply.github.com"
          git add -A
          git commit -m "Refine artifact documentation and checks"
          git push origin HEAD:chore/artifact-cleanup
