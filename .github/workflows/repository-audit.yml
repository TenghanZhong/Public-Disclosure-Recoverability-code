name: repository-audit

on:
  push:
    branches:
      - audit/repository-hygiene

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Scan tracked text files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          files = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          skip_suffixes = {".pdf", ".png", ".jpg", ".jpeg", ".gif", ".parquet", ".pyc", ".zip"}

          ai_terms = [
              "g" + "pt",
              "chat" + "gpt",
              "open" + "ai",
              "anth" + "ropic",
              "clau" + "de",
              "co" + "pilot",
              "co" + "dex",
              "gem" + "ini",
              "large language model",
              "ai-generated",
              "generated by ai",
          ]
          backstage_terms = [
              "paper-facing",
              "paper facing",
              "for the paper",
              "reported table",
              "table 2 implementation",
              "reviewer",
              "rebuttal",
              "camera-ready",
              "submission",
              "note to self",
              "todo",
              "fixme",
              "xxx",
              "scratch",
              "temporary",
              "older script",
              "legacy script",
              "for now",
              "we need",
              "i think",
          ]
          identity_terms = [
              "tenghan",
              "zhong",
              "tenghanzhong",
              "usc.edu",
              "gatech.edu",
              "sjtu.edu.cn",
              "university of southern california",
              "georgia institute of technology",
              "shanghai jiao tong university",
              "c:\\users\\",
              "/users/",
          ]

          categories = {
              "AI_OR_ASSISTANT": ai_terms,
              "BACKSTAGE": backstage_terms,
              "IDENTITY_OR_PATH": identity_terms,
          }
          hits = []
          comment_hits = []
          for raw in files:
              path = Path(raw)
              if path.suffix.lower() in skip_suffixes:
                  continue
              try:
                  data = path.read_bytes()
              except OSError:
                  continue
              if b"\x00" in data:
                  continue
              text = data.decode("utf-8", errors="replace")
              low = text.lower()
              for category, terms in categories.items():
                  for term in terms:
                      if term in low:
                          for lineno, line in enumerate(text.splitlines(), 1):
                              if term in line.lower():
                                  hits.append((category, raw, lineno, line.strip()))
              if path.suffix.lower() == ".py":
                  for lineno, line in enumerate(text.splitlines(), 1):
                      stripped = line.strip()
                      if stripped.startswith("#") and re.search(r"\b(i|we|our|you)\b", stripped, re.I):
                          comment_hits.append((raw, lineno, stripped))

          print("TRACKED_FILES", len(files))
          print("TEXT_SCAN_HITS", len(hits))
          for item in hits:
              print(" | ".join(map(str, item)))
          print("FIRST_PERSON_COMMENT_HITS", len(comment_hits))
          for item in comment_hits:
              print(" | ".join(map(str, item)))

          suspect_names = [p for p in files if re.search(r"(?:^|/)(?:draft|old|copy|final|scratch|temp|review)(?:[._/-]|$)", p, re.I)]
          print("SUSPECT_FILENAMES", len(suspect_names))
          for path in suspect_names:
              print(path)
          PY

      - name: Check reported supervised values
        shell: bash
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          path = Path("tables/supervised_ranker_f20_reported.csv")
          rows = list(csv.DictReader(path.open(encoding="utf-8")))
          assert len(rows) == 2
          expected = {
              "Supervised ranking, global menu, f20": (0.20, 34.83, 0.164, 14.32),
              "Supervised ranking, feasibility filter, f20": (0.20, 31.82, 0.323, 0.00),
          }
          for row in rows:
              exp = expected[row["model_label"]]
              got = (
                  float(row["recommendation_fraction"]),
                  float(row["point_estimate_coverage_pct"]),
                  float(row["point_estimate_distance_l1"]),
                  float(row["point_estimate_violation_pct"]),
              )
              assert got == exp, (row["model_label"], got, exp)
          print("supervised_f20_table_ok")
          PY

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q mandate_setirl scripts tests

      - name: Run tests
        run: pytest -q
