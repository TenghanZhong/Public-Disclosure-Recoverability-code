name: run-cleanup

on:
  pull_request:
    branches:
      - main

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/artifact-cleanup
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply changes
        shell: bash
        run: |
          sed -n "/cat > \/tmp\/changes.b64 <<'EOF'/,/^EOF$/p" .github/workflows/apply-cleanup.yml | sed '1d;$d' > /tmp/changes.b64
          base64 -d /tmp/changes.b64 | gzip -d > /tmp/changes.patch
          git apply /tmp/changes.patch
          rm -f .github/workflows/apply-cleanup.yml .github/workflows/run-cleanup.yml

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate
        shell: bash
        run: |
          set +e
          python -m compileall -q mandate_setirl scripts tests > compile.log 2>&1
          compile_status=$?
          pytest -q > pytest.log 2>&1
          pytest_status=$?
          echo "compile_status=${compile_status}" > validation-status.txt
          echo "pytest_status=${pytest_status}" >> validation-status.txt
          cat validation-status.txt
          cat pytest.log
          exit 0

      - name: Build snapshot
        if: always()
        shell: bash
        run: |
          zip -qr post-cleanup-snapshot.zip . -x '.git/*' 'post-cleanup-snapshot.zip'

      - name: Upload inspection bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cleanup-inspection-bundle
          path: |
            validation-status.txt
            compile.log
            pytest.log
            post-cleanup-snapshot.zip
